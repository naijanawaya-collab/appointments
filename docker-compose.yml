# Local development database.
# Production uses Neon (same Postgres engine), so nothing here is Docker-specific in the app code.
services:
  db:
    image: postgres:17-alpine
    container_name: appointments-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appointments
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appointments"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
